[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adlib-api"
dynamic = ["version"]
description = "Python client for the AdLib API: one REST API for the public ad libraries of Meta, Google (incl. YouTube), TikTok, LinkedIn, Pinterest, X, Snapchat, Apple, Amazon and Microsoft, with ad history, creative features, watchlists and webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "AdLib" }]
keywords = ["ad library", "meta ad library", "facebook ads", "google ads transparency", "tiktok ads", "linkedin ads", "youtube ads", "snapchat ads", "amazon ads", "competitor ads", "ad intelligence", "adlib", "sdk", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23.0,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "mypy>=1.5"]

[project.urls]
Homepage = "https://adlibapi.com"
Documentation = "https://api.adlibapi.com/docs"
Repository = "https://github.com/AdLibAPI/adlib-python"

[tool.hatch.version]
path = "src/adlib/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/adlib"]

[tool.hatch.build.targets.sdist]
include = ["src/adlib", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/adlib"]
